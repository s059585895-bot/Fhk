<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10-sinf fizika · Tebranishlar va to‘lqinlar</title>
<style>
:root{--bg:#eef1ec;--panel:#fff;--text:#1b2430;--muted:#5c6672;--line:#d6ddd7;--teal:#1f8a7a;--tealsoft:#e3f2ee;--shadow:0 6px 24px rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#12171c;--panel:#1b2229;--text:#e8edf1;--muted:#9aa6b1;--line:#2d3640;--teal:#3cbfa9;--tealsoft:#1d3a36;--shadow:0 6px 24px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;overflow:hidden}
.content{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.topbar .ttl{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ttl small{display:block;font-weight:600;font-size:12px;color:var(--teal);letter-spacing:.06em}
.nav{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;width:40px;height:40px;font-size:18px;cursor:pointer}
.nav:hover:not(:disabled){border-color:var(--teal);color:var(--teal)}
.nav:disabled{opacity:.35;cursor:default}
.menu{display:none;border:0;background:var(--teal);color:#fff;border-radius:8px;height:40px;padding:0 14px;font:inherit;font-weight:600;cursor:pointer}
.frame{flex:1;width:100%;border:0;background:var(--bg)}
.side{width:290px;flex:none;height:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.side h2{margin:0;padding:18px 18px 4px;font-size:13px;letter-spacing:.1em;color:var(--teal)}
.side p{margin:0;padding:0 18px 12px;font-size:13px;color:var(--muted)}
.list{flex:1;overflow:auto;padding:4px 12px 16px;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;font:inherit;cursor:pointer;transition:.15s}
.item:hover{border-color:var(--teal);transform:translateX(-2px)}
.item .num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--teal)}
.item .nm{font-size:15px;line-height:1.3;font-weight:600}
.item.active{background:var(--tealsoft);border-color:var(--teal)}
.item.active .num{background:var(--teal);color:#fff;border-color:var(--teal)}
.item:focus-visible,.nav:focus-visible,.menu:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.foot{padding:10px 18px;padding-bottom:max(10px,env(safe-area-inset-bottom));font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.scrim{display:none}
@media (max-width:820px){
 .menu{display:block}
 .side{position:fixed;right:0;top:0;bottom:0;width:min(320px,86vw);z-index:20;transform:translateX(100%);transition:transform .25s;box-shadow:var(--shadow)}
 body.open .side{transform:none}
 .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10}
 body.open .scrim{display:block}
}
</style>
</head>

</div>

  <div class="foot">Klaviatura: ← → mavzular orasida</div>
</aside>

s=\"panel\"><h2>Asosiy tushunchalar<\/h2><p><b>Tebranish<\/b> — jismning muvozanat holati atrofida takrorlanib turadigan harakati. <b>Amplituda A<\/b> — eng katta og‘ish; <b>davr T<\/b> — bitta to‘liq tebranish vaqti; <b>chastota ν<\/b> — bir sekunddagi tebranishlar soni.<\/p><div class=\"formula\">T = t / N &nbsp;&nbsp; ν = N / t = 1 / T<\/div><p>Davr sekund (s), chastota gers (Hz), amplituda esa metr (m) bilan o‘lchanadi.<\/p><\/section>\n<section class=\"panel\"><h2>Simulyatsiya: tebranish grafigi<\/h2><canvas id=\"c\" width=\"720\" height=\"250\"><\/canvas><div class=\"grid\"><div><label for=\"amp\">Amplituda: <b id=\"av\">45<\/b><\/label><input id=\"amp\" type=\"range\" min=\"10\" max=\"90\" value=\"45\"><\/div><div><label for=\"period\">Davr: <b id=\"pv\">2.0 s<\/b><\/label><input id=\"period\" type=\"range\" min=\"5\" max=\"40\" value=\"20\"><\/div><\/div><div class=\"readout\" id=\"out\"><\/div><button id=\"pause\">To‘xtatish<\/button><button id=\"reset\">Qayta boshlash<\/button><\/section>\n<section class=\"panel\"><h2>Kundalik hayotdan misollar<\/h2><ul><li>Soat mayatnigining harakati.<\/li><li>Gitara torining tebranishi.<\/li><li>Prujinaga osilgan yukning yuqoriga-pastga harakati.<\/li><\/ul><\/section><p class=\"muted small\">Interaktiv o‘quv materiali · Internet talab qilinmaydi<\/p><\/main><script>const c=document.getElementById('c'),x=c.getContext('2d'),amp=document.getElementById('amp'),period=document.getElementById('period');let start=performance.now(),run=true;function draw(now){x.clearRect(0,0,720,250);x.strokeStyle='#cbd5ce';x.beginPath();x.moveTo(15,125);x.lineTo(705,125);x.stroke();let A=+amp.value,T=+period.value/10;x.strokeStyle='#1f8a7a';x.lineWidth=3;x.beginPath();for(let px=15;px<705;px++){let y=125-A*Math.sin((px-15)/690*4*Math.PI-(now-start)/1000*2*Math.PI/T);px===15?x.moveTo(px,y):x.lineTo(px,y)}x.stroke();document.getElementById('av').textContent=A;document.getElementById('pv').textContent=T.toFixed(1)+' s';document.getElementById('out').textContent='Chastota ν = '+(1/T).toFixed(2)+' Hz · Davr T = '+T.toFixed(1)+' s';if(run)requestAnimationFrame(draw)}requestAnimationFrame(draw);document.getElementById('pause').onclick=()=>{run=!run;document.getElementById('pause').textContent=run?'To‘xtatish':'Davom ettirish';if(run)requestAnimationFrame(draw)};document.getElementById('reset').onclick=()=>{start=performance.now();if(!run){run=true;document.getElementById('pause').textContent='To‘xtatish';requestAnimationFrame(draw)}};<\/script><\/body><\/html>"}, {"n": "16", "t": "Prujinali va matematik mayatniklar", "h": "<!DOCTYPE html><html lang=\"uz\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>Prujinali va matematik mayatniklar<\/title><style>\n:root{--bg:#eef1ec;--panel:#fff;--text:#1b2430;--muted:#5c6672;--line:#d6ddd7;--teal:#1f8a7a;--blue:#2f5fa8;--amber:#c9660b}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,sans-serif}\nmain{max-width:850px;margin:auto;padding:22px 18px 60px}.hero,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin:18px 0}\n.kicker{color:var(--teal);font-size:12px;letter-spacing:.1em;font-weight:700}h1{font-size:clamp(28px,6vw,42px);line-height:1.15;margin:8px 0}h2{font-size:23px;margin:0 0 10px}.muted{color:var(--muted)}.formula{background:#f5f8f6;border-left:4px solid var(--teal);padding:13px 16px;margin:15px 0;font-size:18px;overflow-wrap:anywhere}\nlabel{display:block;margin:8px 0 4px}input[type=range]{width:100%;accent-color:var(--teal)}input[type=number]{padding:8px;border:1px solid var(--line);border-radius:6px;max-width:130px;font:inherit}button{border:0;border-radius:6px;padding:10px 14px;background:var(--teal);color:white;font:inherit;cursor:pointer;margin:6px 4px 4px 0}canvas{display:block;width:100%;height:auto;background:#f7f8f5;border-radius:7px;border:1px solid var(--line);margin:12px 0}.readout{background:#edf6f3;padding:12px;border-radius:7px;margin:12px 0}li{margin:6px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.small{font-size:14px}.problem{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}\n<\/style><\/head><body><main><header class=\"hero\"><div class=\"kicker\">10-SINF FIZIKA · 16-MAVZU<\/div><h1>Prujinali va matematik mayatniklar<\/h1><p class=\"muted\">Mayatniklarning tebranish davri va unga ta’sir qiluvchi kattaliklar.<\/p><\/header><section class=\"panel\"><h2>Prujinali mayatnik<\/h2><p>Prujinaga mahkamlangan yuk muvozanat holatidan siljitilsa, qaytaruvchi elastiklik kuchi ta’sirida tebranadi.<\/p><div class=\"formula\">T = 2π√(m / k)<\/div><p>m — yuk massasi (kg), k — prujina bikrligi (N/m). Massa ortsa davr ortadi; prujina bikrligi ortsa davr kamayadi.<\/p><canvas id=\"spring\" width=\"720\" height=\"220\"><\/canvas><div class=\"grid\"><div><label for=\"m\">Massa: <b id=\"mv\"><\/b><\/label><input id=\"m\" type=\"range\" min=\"10\" max=\"200\" value=\"50\"><\/div><div><label for=\"k\">Bikrlik: <b id=\"kv\"><\/b><\/label><input id=\"k\" type=\"range\" min=\"5\" max=\"100\" value=\"25\"><\/div><\/div><div class=\"readout\" id=\"springOut\"><\/div><\/section>\n<section class=\"panel\"><h2>Matematik mayatnik<\/h2><p>Cho‘zilmaydigan yengil ipga osilgan kichik jism matematik mayatnik modeli sifatida qaraladi. Kichik tebranishlarda uning davri ip uzunligi va erkin tushish tezlanishiga bog‘liq.<\/p><div class=\"formula\">T = 2π√(l / g)<\/div><p>l — ip uzunligi (m), g — erkin tushish tezlanishi (taxminan 9,8 m/s²).<\/p><canvas id=\"pend\" width=\"720\" height=\"220\"><\/canvas><label for=\"l\">Ip uzunligi: <b id=\"lv\"><\/b><\/label><input id=\"l\" type=\"range\" min=\"20\" max=\"200\" value=\"100\"><div class=\"readout\" id=\"pendOut\"><\/div><\/section><p class=\"muted small\">Interaktiv o‘quv materiali · Internet talab qilinmaydi<\/p><\/main><script>const spring=document.getElementById('spring').getContext('2d');function ds(){let m=+document.getElementById('m').value/100,k=+document.getElementById('k').value,T=2*Math.PI*Math.sqrt(m/k);document.getElementById('mv').textContent=m.toFixed(2)+' kg';document.getElementById('kv').textContent=k+' N/m';document.getElementById('springOut').textContent='Tebranish davri T = '+T.toFixed(2)+' s · Chastota ν = '+(1/T).toFixed(2)+' Hz';spring.clearRect(0,0,720,220);spring.strokeStyle='#1f8a7a';spring.lineWidth=3;spring.beginPath();spring.moveTo(360,20);for(let i=0;i<10;i++)spring.lineTo(360+(i%2?18:-18),35+i*13);spring.lineTo(360,165);spring.stroke();spring.fillStyle='#c9660b';spring.fillRect(325,165,70,35)}document.getElementById('m').oninput=document.getElementById('k').oninput=ds;ds();const pc=document.getElementById('pend').getContext('2d');function dp(){let l=+document.getElementById('l').value/100,g=9.8,T=2*Math.PI*Math.sqrt(l/g);document.getElementById('lv').textContent=l.toFixed(2)+' m';document.getElementById('pendOut').textContent='Tebranish davri T = '+T.toFixed(2)+' s';pc.clearRect(0,0,720,220);pc.strokeStyle='#1f8a7a';pc.lineWidth=3;pc.beginPath();pc.moveTo(360,20);pc.lineTo(405,165);pc.stroke();pc.fillStyle='#c9660b';pc.beginPath();pc.arc(405,165,17,0,7);pc.fill()}document.getElementById('l').oninput=dp;dp();<\/script><\/body><\/html>"}, {"n": "17", "t": "Laboratoriya ishi: g ni aniqlash", "h": "<!DOCTYPE html><html lang=\"uz\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>Laboratoriya ishi: erkin tushish tezlanishini aniqlash<\/title><style>\n:root{--bg:#eef1ec;--panel:#fff;--text:#1b2430;--muted:#5c6672;--line:#d6ddd7;--teal:#1f8a7a;--blue:#2f5fa8;--amber:#c9660b}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,sans-serif}\nmain{max-width:850px;margin:auto;padding:22px 18px 60px}.hero,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin:18px 0}\n.kicker{color:var(--teal);font-size:12px;letter-spacing:.1em;font-weight:700}h1{font-size:clamp(28px,6vw,42px);line-height:1.15;margin:8px 0}h2{font-size:23px;margin:0 0 10px}.muted{color:var(--muted)}.formula{background:#f5f8f6;border-left:4px solid var(--teal);padding:13px 16px;margin:15px 0;font-size:18px;overflow-wrap:anywhere}\nlabel{display:block;margin:8px 0 4px}input[type=range]{width:100%;accent-color:var(--teal)}input[type=number]{padding:8px;border:1px solid var(--line);border-radius:6px;max-width:130px;font:inherit}button{border:0;border-radius:6px;padding:10px 14px;background:var(--teal);color:white;font:inherit;cursor:pointer;margin:6px 4px 4px 0}canvas{display:block;width:100%;height:auto;background:#f7f8f5;border-radius:7px;border:1px solid var(--line);margin:12px 0}.readout{background:#edf6f3;padding:12px;border-radius:7px;margin:12px 0}li{margin:6px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.small{font-size:14px}.problem{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}\n<\/style><\/head><body><main><header class=\"hero\"><div class=\"kicker\">10-SINF FIZIKA · 17-MAVZU<\/div><h1>Laboratoriya ishi: erkin tushish tezlanishini aniqlash<\/h1><p class=\"muted\">Matematik mayatnik tebranishlarini o‘lchash orqali g ni tajribada aniqlash.<\/p><\/header><section class=\"panel\"><h2>Ishning maqsadi<\/h2><p>Matematik mayatnikning uzunligi va tebranish davrini o‘lchab, erkin tushish tezlanishini hisoblash.<\/p><h2>Kerakli jihozlar<\/h2><p>Ip, kichik yuk, shtativ, chizg‘ich va sekundomer.<\/p><div class=\"formula\">T = t / N &nbsp;&nbsp;&nbsp; g = 4π²l / T²<\/div><h2>Ishni bajarish tartibi<\/h2><ol><li>Ip uzunligini osilish nuqtasidan yuk markazigacha o‘lchang.<\/li><li>Mayatnikni kichik burchakka og‘dirib tebranishga qo‘ying.<\/li><li>N ta to‘liq tebranish uchun ketgan vaqt t ni o‘lchang.<\/li><li>T = t/N orqali davrni, so‘ng g formulasidan tezlanishni toping.<\/li><li>Natijani 9,8 m/s² bilan taqqoslang.<\/li><\/ol><\/section>\n<section class=\"panel\"><h2>Interaktiv hisoblagich<\/h2><div class=\"grid\"><div><label for=\"length\">Ip uzunligi l (cm)<\/label><input id=\"length\" type=\"number\" min=\"10\" max=\"300\" value=\"100\"><\/div><div><label for=\"n\">Tebranishlar soni N<\/label><input id=\"n\" type=\"number\" min=\"1\" max=\"100\" value=\"20\"><\/div><div><label for=\"time\">Umumiy vaqt t (s)<\/label><input id=\"time\" type=\"number\" min=\"0.1\" max=\"1000\" step=\"0.1\" value=\"40.2\"><\/div><\/div><button id=\"calc\">Hisoblash<\/button><div class=\"readout\" id=\"result\">Natijani hisoblash uchun qiymatlarni kiriting.<\/div><\/section>\n<section class=\"panel\"><h2>Xatolik manbalari<\/h2><ul><li>Ip uzunligini noto‘g‘ri o‘lchash.<\/li><li>Sekundomerni ishga tushirish yoki to‘xtatishda kechikish.<\/li><li>Tebranishlarni sanashda xato qilish.<\/li><li>Mayatnikni juda katta burchakka og‘dirish.<\/li><\/ul><\/section><p class=\"muted small\">Interaktiv o‘quv materiali · Internet talab qilinmaydi<\/p><\/main><script>document.getElementById('calc').onclick=()=>{let l=+document.getElementById('length').value/100,N=+document.getElementById('n').value,t=+document.getElementById('time').value;let r=document.getElementById('result');if(!(l>0&&N>0&&t>0)){r.textContent='Iltimos, musbat va to‘g‘ri qiymatlarni kiriting.';return}let T=t/N,g=4*Math.PI*Math.PI*l/(T*T),e=Math.abs(g-9.8)/9.8*100;r.innerHTML='Davr T = <b>'+T.toFixed(3)+' s<\/b><br>Erkin tushish tezlanishi g = <b>'+g.toFixed(3)+' m/s²<\/b><br>9,8 m/s² qiymatiga nisbatan farq = <b>'+e.toFixed(2)+'%<\/b>'};<\/script><\/body><\/html>"}, {"n": "18", "t": "Mexanik to‘lqinlar", "h": "<!DOCTYPE html><html lang=\"uz\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>Mexanik to‘lqinlar<\/title><style>\n:root{--bg:#eef1ec;--panel:#fff;--text:#1b2430;--muted:#5c6672;--line:#d6ddd7;--teal:#1f8a7a;--blue:#2f5fa8;--amber:#c9660b}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,sans-serif}\nmain{max-width:850px;margin:auto;padding:22px 18px 60px}.hero,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin:18px 0}\n.kicker{color:var(--teal);font-size:12px;letter-spacing:.1em;font-weight:700}h1{font-size:clamp(28px,6vw,42px);line-height:1.15;margin:8px 0}h2{font-size:23px;margin:0 0 10px}.muted{color:var(--muted)}.formula{background:#f5f8f6;border-left:4px solid var(--teal);padding:13px 16px;margin:15px 0;font-size:18px;overflow-wrap:anywhere}\nlabel{display:block;margin:8px 0 4px}input[type=range]{width:100%;accent-color:var(--teal)}input[type=number]{padding:8px;border:1px solid var(--line);border-radius:6px;max-width:130px;font:inherit}button{border:0;border-radius:6px;padding:10px 14px;background:var(--teal);color:white;font:inherit;cursor:pointer;margin:6px 4px 4px 0}canvas{display:block;width:100%;height:auto;background:#f7f8f5;border-radius:7px;border:1px solid var(--line);margin:12px 0}.readout{background:#edf6f3;padding:12px;border-radius:7px;margin:12px 0}li{margin:6px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.small{font-size:14px}.problem{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}\n<\/style><\/head><body><main><header class=\"hero\"><div class=\"kicker\">10-SINF FIZIKA · 18-MAVZU<\/div><h1>Mexanik to‘lqinlar<\/h1><p class=\"muted\">Tebranishlarning elastik muhitda tarqalishi va energiyaning uzatilishi.<\/p><\/header><section class=\"panel\"><h2>Mexanik to‘lqin nima?<\/h2><p>Mexanik to‘lqin — tebranishlarning moddiy muhitda tarqalishidir. To‘lqin energiyani uzatadi, muhit zarralari esa muvozanat holati atrofida tebranadi. Shu sababli mexanik to‘lqin vakuumda tarqalmaydi.<\/p><div class=\"grid\"><div><h2>Ko‘ndalang to‘lqin<\/h2><p>Zarralar to‘lqin tarqalish yo‘nalishiga perpendikular tebranadi. Misol: tarang ipdagi to‘lqin.<\/p><\/div><div><h2>Bo‘ylama to‘lqin<\/h2><p>Zarralar to‘lqin tarqalish yo‘nalishi bo‘ylab tebranadi. Misol: havodagi tovush to‘lqini.<\/p><\/div><\/div><div class=\"formula\">v = λν = λ / T<\/div><p>v — to‘lqin tezligi (m/s), λ — to‘lqin uzunligi (m), ν — chastota (Hz), T — davr (s).<\/p><\/section>\n<section class=\"panel\"><h2>Simulyatsiya: to‘lqin shakli<\/h2><canvas id=\"wave\" width=\"720\" height=\"250\"><\/canvas><div class=\"grid\"><div><label for=\"a\">Amplituda: <b id=\"av\"><\/b><\/label><input id=\"a\" type=\"range\" min=\"10\" max=\"75\" value=\"35\"><\/div><div><label for=\"wl\">To‘lqin uzunligi: <b id=\"wlv\"><\/b><\/label><input id=\"wl\" type=\"range\" min=\"60\" max=\"260\" value=\"140\"><\/div><div><label for=\"f\">Chastota: <b id=\"fv\"><\/b><\/label><input id=\"f\" type=\"range\" min=\"5\" max=\"40\" value=\"20\"><\/div><\/div><div class=\"readout\" id=\"out\"><\/div><\/section>\n<section class=\"panel\"><h2>Misollar<\/h2><ul><li>Suv yuzasidagi to‘lqinlar.<\/li><li>Tarang ip bo‘ylab tarqaladigan tebranish.<\/li><li>Yer qobig‘ida tarqaladigan seysmik to‘lqinlar.<\/li><\/ul><\/section><p class=\"muted small\">Interaktiv o‘quv materiali · Internet talab qilinmaydi<\/p><\/main><script>const cv=document.getElementById('wave'),ctx=cv.getContext('2d');function draw(){let A=+document.getElementById('a').value,L=+document.getElementById('wl').value,f=+document.getElementById('f').value/10;document.getElementById('av').textContent=A+' px';document.getElementById('wlv').textContent=L+' px';document.getElementById('fv').textContent=f.toFixed(1)+' Hz';document.getElementById('out').textContent='Model tezligi v = λν ≈ '+(L/100*f).toFixed(2)+' m/s';ctx.clearRect(0,0,720,250);ctx.strokeStyle='#cbd5ce';ctx.beginPath();ctx.moveTo(10,125);ctx.lineTo(710,125);ctx.stroke();ctx.strokeStyle='#2f5fa8';ctx.lineWidth=3;ctx.beginPath();for(let x=10;x<710;x++){let y=125-A*Math.sin((x-10)/L*2*Math.PI);x===10?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}['a','wl','f'].forEach(id=>document.getElementById(id).oninput=draw);draw();<\/script><\/body><\/html>"}, {"n": "19", "t": "Tovush to‘lqinlari", "h": "<!DOCTYPE html><html lang=\"uz\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>Tovush to‘lqinlari va masalalar yechish<\/title><style>\n:root{--bg:#eef1ec;--panel:#fff;--text:#1b2430;--muted:#5c6672;--line:#d6ddd7;--teal:#1f8a7a;--blue:#2f5fa8;--amber:#c9660b}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,sans-serif}\nmain{max-width:850px;margin:auto;padding:22px 18px 60px}.hero,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin:18px 0}\n.kicker{color:var(--teal);font-size:12px;letter-spacing:.1em;font-weight:700}h1{font-size:clamp(28px,6vw,42px);line-height:1.15;margin:8px 0}h2{font-size:23px;margin:0 0 10px}.muted{color:var(--muted)}.formula{background:#f5f8f6;border-left:4px solid var(--teal);padding:13px 16px;margin:15px 0;font-size:18px;overflow-wrap:anywhere}\nlabel{display:block;margin:8px 0 4px}input[type=range]{width:100%;accent-color:var(--teal)}input[type=number]{padding:8px;border:1px solid var(--line);border-radius:6px;max-width:130px;font:inherit}button{border:0;border-radius:6px;padding:10px 14px;background:var(--teal);color:white;font:inherit;cursor:pointer;margin:6px 4px 4px 0}canvas{display:block;width:100%;height:auto;background:#f7f8f5;border-radius:7px;border:1px solid var(--line);margin:12px 0}.readout{background:#edf6f3;padding:12px;border-radius:7px;margin:12px 0}li{margin:6px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.small{font-size:14px}.problem{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}\n<\/style><\/head><body><main><header class=\"hero\"><div class=\"kicker\">10-SINF FIZIKA · 19–20-MAVZULAR<\/div><h1>Tovush to‘lqinlari va masalalar yechish<\/h1><p class=\"muted\">Tovushning fizik tabiati, eshitish diapazoni va mexanik tebranishlar hamda to‘lqinlarga doir namunaviy masalalar.<\/p><\/header><section class=\"panel\"><h2>Tovush to‘lqinlari<\/h2><p>Tovush — elastik muhitda tarqaladigan mexanik, odatda bo‘ylama to‘lqin. Tovush manbai tebranganda muhitda siqilish va siyraklashishlar paydo bo‘ladi.<\/p><ul><li>Inson odatda 20 Hz–20 000 Hz chastotali tovushlarni eshitadi.<\/li><li>20 Hz dan past — infratovush.<\/li><li>20 000 Hz dan yuqori — ultratovush.<\/li><li>Havoda tovush tezligi odatdagi sharoitda taxminan 340 m/s.<\/li><\/ul><div class=\"formula\">v = λν &nbsp;&nbsp;&nbsp; λ = v / ν<\/div><canvas id=\"sound\" width=\"720\" height=\"220\"><\/canvas><label for=\"freq\">Tovush chastotasi: <b id=\"freqv\">440 Hz<\/b><\/label><input id=\"freq\" type=\"range\" min=\"100\" max=\"1000\" value=\"440\"><div class=\"readout\" id=\"soundOut\"><\/div><\/section>\n<section class=\"panel\"><h2>Masalalar yechish<\/h2><div class=\"problem\"><b>1-masala. Tebranish davri<\/b><p>Jism 10 sekundda 20 marta tebrandi. Davr va chastotani toping.<\/p><div class=\"formula\">T = t/N = 10/20 = 0,5 s<br>ν = 1/T = 2 Hz<\/div><b>Javob:<\/b> T = 0,5 s; ν = 2 Hz.<\/div><div class=\"problem\"><b>2-masala. Prujinali mayatnik<\/b><p>m = 0,4 kg, k = 25 N/m. Tebranish davrini toping.<\/p><div class=\"formula\">T = 2π√(m/k) = 2π√(0,4/25) ≈ 0,79 s<\/div><b>Javob:<\/b> T ≈ 0,79 s.<\/div><div class=\"problem\"><b>3-masala. Matematik mayatnik<\/b><p>l = 1 m, g = 9,8 m/s². Davrni toping.<\/p><div class=\"formula\">T = 2π√(l/g) = 2π√(1/9,8) ≈ 2,01 s<\/div><b>Javob:<\/b> T ≈ 2,01 s.<\/div><div class=\"problem\"><b>4-masala. To‘lqin tezligi<\/b><p>λ = 2 m, ν = 5 Hz. To‘lqin tezligini toping.<\/p><div class=\"formula\">v = λν = 2 × 5 = 10 m/s<\/div><b>Javob:<\/b> v = 10 m/s.<\/div><div class=\"problem\"><b>5-masala. Tovush to‘lqin uzunligi<\/b><p>Havoda tovush tezligi 340 m/s, chastotasi 170 Hz. To‘lqin uzunligini toping.<\/p><div class=\"formula\">λ = v/ν = 340/170 = 2 m<\/div><b>Javob:<\/b> λ = 2 m.<\/div><\/section><p class=\"muted small\">Interaktiv o‘quv materiali · Internet talab qilinmaydi<\/p><\/main><script>const cv=document.getElementById('sound'),ctx=cv.getContext('2d'),freq=document.getElementById('freq');function draw(){let f=+freq.value;document.getElementById('freqv').textContent=f+' Hz';document.getElementById('soundOut').textContent='Havodagi to‘lqin uzunligi λ = 340/f = '+(340/f).toFixed(2)+' m';ctx.clearRect(0,0,720,220);ctx.strokeStyle='#cbd5ce';ctx.beginPath();ctx.moveTo(10,110);ctx.lineTo(710,110);ctx.stroke();ctx.strokeStyle='#c23b3b';ctx.lineWidth=3;ctx.beginPath();let cycles=1+f/100;for(let x=10;x<710;x++){let y=110-40*Math.sin((x-10)/700*cycles*2*Math.PI);x===10?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}freq.oninput=draw;draw();<\/script><\/body><\/html>"}, {"n": "20", "t": "Masalalar yechish", "h": "<!DOCTYPE html>\n<html lang=\"uz\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>20-mavzu. Masalalar yechish<\/title>\n<style>\n:root{--bg:#eef1ec;--panel:#fff;--text:#1b2430;--muted:#5c6672;--line:#d6ddd7;--teal:#1f8a7a}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,sans-serif}main{max-width:850px;margin:auto;padding:22px 18px 60px}.hero,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin:18px 0}.kicker{color:var(--teal);font-size:12px;letter-spacing:.1em;font-weight:700}h1{font-size:clamp(28px,6vw,42px);line-height:1.15;margin:8px 0}h2{font-size:23px;margin:0 0 10px}.muted{color:var(--muted)}.formula{background:#f5f8f6;border-left:4px solid var(--teal);padding:13px 16px;margin:15px 0;font-size:18px;overflow-wrap:anywhere}label{display:block;margin:8px 0 4px}input,select{padding:9px;border:1px solid var(--line);border-radius:6px;font:inherit;max-width:100%}button{border:0;border-radius:6px;padding:10px 14px;background:var(--teal);color:white;font:inherit;cursor:pointer;margin:6px 4px 4px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.readout{background:#edf6f3;padding:12px;border-radius:7px;margin:12px 0}.problem{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}li{margin:6px 0}.small{font-size:14px}\n<\/style><\/head><body><main>\n<header class=\"hero\"><div class=\"kicker\">10-SINF FIZIKA · 20-MAVZU<\/div><h1>Masalalar yechish<\/h1><p class=\"muted\">Mexanik tebranishlar, mayatniklar, mexanik va tovush to‘lqinlariga doir masalalar. Formulalar, yechimlar va interaktiv hisoblagich.<\/p><\/header>\n<section class=\"panel\"><h2>Masala yechish algoritmi<\/h2><ol><li>Masala shartini diqqat bilan o‘qing.<\/li><li>Berilgan kattaliklarni SI birliklariga o‘tkazing.<\/li><li>Topilishi kerak bo‘lgan kattalikni belgilang.<\/li><li>Mos fizik formulani tanlang va noma’lum kattalikni ajrating.<\/li><li>Son qiymatlarini qo‘yib hisoblang, javobga birlik yozing.<\/li><\/ol><\/section>\n<section class=\"panel\"><h2>Kerakli formulalar<\/h2><div class=\"grid\"><div><b>Tebranish davri<\/b><div class=\"formula\">T = t/N<\/div><\/div><div><b>Chastota<\/b><div class=\"formula\">ν = N/t = 1/T<\/div><\/div><div><b>Prujinali mayatnik<\/b><div class=\"formula\">T = 2π√(m/k)<\/div><\/div><div><b>Matematik mayatnik<\/b><div class=\"formula\">T = 2π√(l/g)<\/div><\/div><div><b>To‘lqin tezligi<\/b><div class=\"formula\">v = λν<\/div><\/div><div><b>To‘lqin uzunligi<\/b><div class=\"formula\">λ = v/ν<\/div><\/div><div><b>Erkin tushish tezlanishi<\/b><div class=\"formula\">g = 4π²l/T²<\/div><\/div><\/div><\/section>\n<section class=\"panel\"><h2>Yechilgan namunaviy masalalar<\/h2>\n<div class=\"problem\"><b>1-masala. Tebranish davri va chastotasi<\/b><p>Jism 12 sekundda 24 marta tebrandi. Davr va chastotani toping.<\/p><p><b>Berilgan:<\/b> t = 12 s, N = 24.<\/p><div class=\"formula\">T = t/N = 12/24 = 0,5 s<br>ν = 1/T = 1/0,5 = 2 Hz<\/div><b>Javob:<\/b> T = 0,5 s; ν = 2 Hz.<\/div>\n<div class=\"problem\"><b>2-masala. Prujinali mayatnik<\/b><p>Massasi 0,25 kg bo‘lgan yuk bikrligi 40 N/m prujinaga osilgan. Tebranish davrini toping.<\/p><p><b>Berilgan:<\/b> m = 0,25 kg, k = 40 N/m.<\/p><div class=\"formula\">T = 2π√(m/k) = 2π√(0,25/40) ≈ 0,50 s<\/div><b>Javob:<\/b> T ≈ 0,50 s.<\/div>\n<div class=\"problem\"><b>3-masala. Matematik mayatnik<\/b><p>Mayatnik ipining uzunligi 0,81 m. g = 9,8 m/s² deb olib, davrini hisoblang.<\/p><div class=\"formula\">T = 2π√(l/g) = 2π√(0,81/9,8) ≈ 1,81 s<\/div><b>Javob:<\/b> T ≈ 1,81 s.<\/div>\n<div class=\"problem\"><b>4-masala. To‘lqin tezligi<\/b><p>To‘lqin uzunligi 1,5 m, chastotasi 8 Hz. To‘lqin tezligini aniqlang.<\/p><div class=\"formula\">v = λν = 1,5 × 8 = 12 m/s<\/div><b>Javob:<\/b> v = 12 m/s.<\/div>\n<div class=\"problem\"><b>5-masala. Tovush to‘lqin uzunligi<\/b><p>Havoda tovush tezligi 340 m/s, chastotasi 500 Hz. To‘lqin uzunligini toping.<\/p><div class=\"formula\">λ = v/ν = 340/500 = 0,68 m<\/div><b>Javob:<\/b> λ = 0,68 m.<\/div>\n<div class=\"problem\"><b>6-masala. Erkin tushish tezlanishi<\/b><p>Mayatnik uzunligi 1 m, davri 2 s. Tajribaviy g qiymatini hisoblang.<\/p><div class=\"formula\">g = 4π²l/T² = 4 × 9,87 × 1/4 ≈ 9,87 m/s²<\/div><b>Javob:<\/b> g ≈ 9,87 m/s².<\/div><\/section>\n<section class=\"panel\"><h2>Interaktiv masala hisoblagichi<\/h2><p>Masala turini tanlang, kattaliklarni kiriting va “Hisoblash” tugmasini bosing.<\/p>\n<label for=\"kind\">Masala turi<\/label><select id=\"kind\"><option value=\"period\">Davr: T = t/N<\/option><option value=\"frequency\">Chastota: ν = N/t<\/option><option value=\"wave\">To‘lqin tezligi: v = λν<\/option><option value=\"wavelength\">To‘lqin uzunligi: λ = v/ν<\/option><option value=\"g\">Erkin tushish: g = 4π²l/T²<\/option><option value=\"pendulum\">Matematik mayatnik davri: T = 2π√(l/g)<\/option><\/select>\n<div class=\"grid\"><div><label for=\"a\" id=\"la\">Vaqt t (s)<\/label><input id=\"a\" type=\"number\" step=\"any\" value=\"12\"><\/div><div><label for=\"b\" id=\"lb\">Tebranishlar soni N<\/label><input id=\"b\" type=\"number\" step=\"any\" value=\"24\"><\/div><\/div><button id=\"calc\">Hisoblash<\/button><div class=\"readout\" id=\"result\">Hisoblash natijasi shu yerda ko‘rsatiladi.<\/div><\/section>\n<section class=\"panel\"><h2>Mustaqil yechish uchun<\/h2><ol><li>Jism 15 sekundda 30 marta tebrandi. Davr va chastotani toping.<\/li><li>To‘lqin chastotasi 12 Hz, uzunligi 0,4 m. Tezligini aniqlang.<\/li><li>Havodagi tovush tezligi 340 m/s, chastotasi 680 Hz. To‘lqin uzunligini toping.<\/li><li>Ip uzunligi 0,25 m bo‘lgan matematik mayatnik davrini hisoblang (g = 9,8 m/s²).<\/li><\/ol><details><summary><b>Javoblarni tekshirish<\/b><\/summary><ul><li>1) T = 0,5 s; ν = 2 Hz.<\/li><li>2) v = 4,8 m/s.<\/li><li>3) λ = 0,5 m.<\/li><li>4) T ≈ 1,00 s.<\/li><\/ul><\/details><\/section><p class=\"muted small\">Eslatma: hisob-kitoblarda natijalar yaxlitlangan bo‘lishi mumkin.<\/p>\n<\/main><script>\nconst kind=document.getElementById('kind'),a=document.getElementById('a'),b=document.getElementById('b'),la=document.getElementById('la'),lb=document.getElementById('lb'),result=document.getElementById('result');\nconst labels={period:['Vaqt t (s)','Tebranishlar soni N'],frequency:['Tebranishlar soni N','Vaqt t (s)'],wave:['To‘lqin uzunligi λ (m)','Chastota ν (Hz)'],wavelength:['To‘lqin tezligi v (m/s)','Chastota ν (Hz)'],g:['Mayatnik uzunligi l (m)','Davr T (s)'],pendulum:['Mayatnik uzunligi l (m)','Erkin tushish tezlanishi g (m/s²)']};\nfunction update(){[la.textContent,lb.textContent]=labels[kind.value];if(kind.value==='frequency'){a.value=24;b.value=12}else if(kind.value==='wave'){a.value=1.5;b.value=8}else if(kind.value==='wavelength'){a.value=340;b.value=500}else if(kind.value==='g'){a.value=1;b.value=2}else if(kind.value==='pendulum'){a.value=1;b.value=9.8}else{a.value=12;b.value=24}result.textContent='Qiymatlarni tekshirib, “Hisoblash” tugmasini bosing.'}\nkind.onchange=update;\ndocument.getElementById('calc').onclick=()=>{const x=Number(a.value),y=Number(b.value);if(!Number.isFinite(x)||!Number.isFinite(y)||x<=0||y<=0){result.textContent='Iltimos, musbat qiymatlarni kiriting.';return}let val,txt;switch(kind.value){case'period':val=x/y;txt='T = t/N = '+x+'/'+y+' = '+val.toFixed(4)+' s';break;case'frequency':val=x/y;txt='ν = N/t = '+x+'/'+y+' = '+val.toFixed(4)+' Hz';break;case'wave':val=x*y;txt='v = λν = '+x+' × '+y+' = '+val.toFixed(4)+' m/s';break;case'wavelength':val=x/y;txt='λ = v/ν = '+x+'/'+y+' = '+val.toFixed(4)+' m';break;case'g':val=4*Math.PI*Math.PI*x/(y*y);txt='g = 4π²l/T² ≈ '+val.toFixed(4)+' m/s²';break;case'pendulum':val=2*Math.PI*Math.sqrt(x/y);txt='T = 2π√(l/g) ≈ '+val.toFixed(4)+' s';break}result.textContent=txt};\n<\/script><\/body><\/html>"}]</script>
<script>
const T=JSON.parse(document.getElementById('d').textContent);
const list=document.getElementById('list'),frame=document.getElementById('frame'),ttl=document.getElementById('ttl');
const prev=document.getElementById('prev'),next=document.getElementById('next');
let cur=-1;
T.forEach((t,i)=>{
  const b=document.createElement('button');b.className='item';b.dataset.i=i;
  b.innerHTML='<span class="num">'+t.n+'</span><span class="nm"></span>';
  b.querySelector('.nm').textContent=t.t;
  b.onclick=()=>go(i);list.appendChild(b);
});
function go(i,keepHash){
  if(i<0||i>=T.length)return;
  cur=i;
  frame.srcdoc=T[i].h;
  ttl.innerHTML='<small>'+T[i].n+'-MAVZU</small>';
  const s=document.createElement('span');s.textContent=T[i].t;ttl.appendChild(s);
  document.title=T[i].t+' · 10-sinf fizika';
  list.querySelectorAll('.item').forEach(e=>e.classList.toggle('active',+e.dataset.i===i));
  list.querySelector('.active').scrollIntoView({block:'nearest'});
  prev.disabled=i===0;next.disabled=i===T.length-1;
  if(!keepHash)history.replaceState(null,'','#'+T[i].n);
  try{localStorage.setItem('fizika-topic',T[i].n)}catch(e){}
  document.body.classList.remove('open');
}
prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);
document.getElementById('menu').onclick=()=>document.body.classList.add('open');
document.getElementById('scrim').onclick=()=>document.body.classList.remove('open');
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
  if(e.key==='Escape')document.body.classList.remove('open');
});
function start(){
  let n=location.hash.slice(1);
  if(!n){try{n=localStorage.getItem('fizika-topic')||''}catch(e){}}
  const i=T.findIndex(t=>t.n===n);
  go(i>=0?i:0,true);
}
window.addEventListener('hashchange',()=>{const i=T.findIndex(t=>t.n===location.hash.slice(1));if(i>=0&&i!==cur)go(i,true)});
start();
</script>
</body>
</html>
